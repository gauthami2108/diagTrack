{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back shortly | DiagTrack</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f5f9; --card: #fff; --ink: #14213a; --muted: #5b6780; --brand: #274a99; --line: #dfe4ee; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1524; --card: #162036; --ink: #e8edf7; --muted: #9aa7c0; --brand: #7d9ce6; --line: #263453; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 32px 36px; max-width: 440px; margin: 16px; box-shadow: 0 10px 30px rgba(10, 20, 40, .08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 18px; }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 4%; background: var(--brand); border-radius: 99px; transition: width .6s; }
  small { display: block; margin-top: 10px; color: var(--muted); }
</style></head>
<body><div class="card" role="status" aria-live="polite">
  <h1>DiagTrack is back shortly</h1>
  <p>{{ reason|default:"Maintenance is in progress." }} This page refreshes by itself when it is done. Nothing you need to do.</p>
  <div class="bar"><i id="bar"></i></div><small id="step">Working...</small>
</div>
<script>
(function poll() {
  fetch("/maintenance/status.json", {cache: "no-store"}).then(r => r.json()).then(d => {
    if (!d.maintenance) { location.reload(); return; }
    document.getElementById("bar").style.width = Math.max(4, d.percent || 0) + "%";
    if (d.step) document.getElementById("step").textContent = d.step;
    setTimeout(poll, 3000);
  }).catch(() => setTimeout(poll, 5000));
})();
</script></body></html>
