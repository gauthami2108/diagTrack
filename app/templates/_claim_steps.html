{% if c.progress %}<ol class="claim-steps" aria-label="Claim progress: {{ c.get_status_display }}">{% for l, st in c.progress %}<li class="cs-{{ st }}"{% if st == 'current' %} aria-current="step"{% endif %}>{{ l }}</li>{% endfor %}</ol>{% if c.is_open %}<small class="muted">{% if c.waiting_days %}Here for {{ c.waiting_days }} day{{ c.waiting_days|pluralize }}{% else %}Moved today{% endif %}</small>{% endif %}{% endif %}
