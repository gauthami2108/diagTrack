{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change password</h1><p class="sub">At least 8 characters.</p></div></div>
<form class="form-card narrow" method="post" novalidate>{% csrf_token %}
  {% for f in form %}{% include "_field.html" %}{% endfor %}
  <div class="form-foot"><a class="btn" href="{% url 'home' %}">Cancel</a><button class="btn btn-primary" type="submit">Change password</button></div>
</form>
{% endblock %}
