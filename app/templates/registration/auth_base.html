{% load static dt %}<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} | DiagTrack</title>
<link rel="icon" href="{% static 'img/icon.svg' %}" type="image/svg+xml">
<script>(function(){try{var t=localStorage.getItem('dt-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth">
  <div class="auth-film" aria-hidden="true">
    <div class="film-frames"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="auth-pitch">
      <span class="brand-mark brand-mark-l"><i></i><i></i><i></i></span>
      <p class="auth-line">Every fault logged.<br>Every deadline watched.</p>
      <p class="auth-org">{{ cfg.org_name }}</p>
    </div>
  </div>
  <main class="auth-main">
    <div class="auth-card">
      <p class="auth-brand"><span class="brand-mark"><i></i><i></i><i></i></span>DiagTrack</p>
      {% block card %}{% endblock %}
    </div>
  </main>
</body>
</html>
