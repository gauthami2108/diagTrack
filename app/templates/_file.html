{% load dt %}{% if f.is_image %}<a class="thumb" href="{% url 'attachment' f.pk %}" target="_blank" rel="noopener" data-lightbox><img src="{% url 'attachment' f.pk %}" alt="{{ f.name }}" loading="lazy"></a>{% else %}<a class="file" href="{% url 'attachment' f.pk %}" target="_blank" rel="noopener">{% icon 'file-text' %}<span>{{ f.name }}<small>{{ f.size|filesizeformat }}</small></span></a>{% endif %}
