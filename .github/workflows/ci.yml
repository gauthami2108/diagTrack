# Checks every change on real machines:
#   tests            the test suite on PostgreSQL 17, and the setup program's own tests
#   docker           setup -> up -> verify -> test restore, and a move file for the next job
#   windows          native install on Windows Server 2022: install, check, update, test restore, remove
#   windows-move-in  native Windows install that moves in from the Docker move file
# Windows Server 2016 and Windows 11 are not offered by GitHub: test those on the real server (see the runbook).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DT_ADMIN_PASSWORD: Ci-Admin-2026x
  DT_BACKUP_PASSPHRASE: continuous integration passphrase
  DT_UNATTENDED: "1"

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:17
        env: {POSTGRES_USER: diagtrack, POSTGRES_PASSWORD: diagtrack, POSTGRES_DB: diagtrack}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U diagtrack" --health-interval 5s --health-retries 20
    env: {DB_HOST: localhost, DB_PORT: "5432", DB_NAME: diagtrack, DB_USER: diagtrack, DB_PASSWORD: diagtrack, DEBUG: "1"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: PostgreSQL 17 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: pip install -r app/requirements.txt
      - name: Test suite
        working-directory: app
        run: |
          set -o pipefail
          python manage.py test tickets --noinput 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Report test failures
        if: failure()
        run: |
          python - <<'PY'
          import os, re
          text = open(os.path.join(os.environ["RUNNER_TEMP"], "tests.log"), errors="replace").read()
          lines = [l for l in text.splitlines() if not l.startswith(("Created the", "Created default"))]
          text = "\n".join(lines)
          m = re.search(r"^(FAIL|ERROR): ", text, re.M)
          parts = [text[m.start():][i:i + 3000] for i in range(0, 15000, 3000)] if m else []
          parts.append(text[-3000:])
          for msg in filter(None, parts):
              msg = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=test failure::{msg}")
          PY
      - run: python -m unittest discover -s installer/tests -v

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Setup (unattended)
        run: docker compose run --rm -T -e DT_ADMIN_PASSWORD -e DT_BACKUP_PASSPHRASE -v "$PWD/ci:/ci:ro" setup --answers /ci/answers-docker.json
      - run: docker compose up -d
      - name: Verify
        run: docker compose run --rm -T setup verify
      - name: Check and test-restore the newest backup
        run: docker compose exec -T backup python manage.py verifybackup --dest dest1 --test-restore
      - name: Move file for the Windows job
        run: |
          docker compose exec -T web python manage.py seed_demo || true
          docker compose exec -T backup python manage.py backup --full-to /backups/move
          mkdir -p move && sudo cp data/backups/move/*-full.dtbak move/move.dtbak
      - uses: actions/upload-artifact@v4
        with: {name: move-file, path: move/move.dtbak}
      - if: failure()
        name: Report the logs as annotations
        run: |
          for s in web worker backup db; do
            echo "::warning title=$s::$(docker compose logs --no-color --tail 40 $s 2>&1 | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          [ -f data/status/setup.log ] && echo "::warning title=setup.log::$(tail -n 60 data/status/setup.log | tail -c 3500 | sed ':a;N;$!ba;s/\n/%0A/g')" || true

  docker-upgrade:
    # The first Docker version kept its passwords in .env. Install it, add data, then upgrade the way a user does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install the first Docker version and add demo data
        run: |
          git checkout -q a410a88
          docker compose up -d --build --wait
          docker compose exec -T web python manage.py seed_demo
          docker compose exec -T web python manage.py shell -c "from tickets.models import Ticket; print(Ticket.objects.count())" | tail -1 | tee "$RUNNER_TEMP/before"
          docker compose down
      - name: start.sh explains that setup is needed
        run: |
          git checkout -q -f "$GITHUB_SHA"
          if ./scripts/start.sh > "$RUNNER_TEMP/start.out" 2>&1; then echo "::error::start.sh started without setup"; exit 1; fi
          cat "$RUNNER_TEMP/start.out"
          grep -q "earlier version" "$RUNNER_TEMP/start.out"
      - name: Setup upgrades it
        run: |
          docker compose run --rm --build -T -e DT_BACKUP_PASSPHRASE -v "$PWD/ci:/ci:ro" setup --answers /ci/answers-upgrade.json
          if [ -f .env ] && grep -E "DB_PASSWORD|ADMIN_PASSWORD|SECRET_KEY" .env; then echo "::error::passwords left in .env"; exit 1; fi
          ./scripts/start.sh
      - name: Verify, and every ticket is still there
        run: |
          docker compose run --rm -T setup verify
          after=$(docker compose exec -T web python manage.py shell -c "from tickets.models import Ticket; print(Ticket.objects.count())" | tail -1)
          echo "before $(cat "$RUNNER_TEMP/before"), after $after"
          test "$after" = "$(cat "$RUNNER_TEMP/before")"
      - name: Report
        if: failure()
        continue-on-error: true
        run: |
          for svc in db web worker backup; do
            docker compose logs --no-color --tail 40 $svc 2>&1 | tail -40 | python3 -c "import sys; t=sys.stdin.read()[-3000:].replace('%','%25').replace('\r','').replace('\n','%0A'); print(f'::warning title=$svc log::{t}')"
          done

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install
        shell: cmd
        run: Setup.cmd --answers ci\answers-windows.json install
      - name: Screens answer
        shell: pwsh
        run: (Invoke-WebRequest http://localhost:8088/healthz -UseBasicParsing).StatusCode
      - name: Check and test-restore the first backup
        shell: cmd
        run: |
          set DIAGTRACK_HOME=C:\ProgramData\DiagTrack
          "C:\Program Files\DiagTrack\python\python.exe" "C:\Program Files\DiagTrack\app\manage.py" verifybackup --dest dest1 --test-restore
      - name: Update (same version, proves the update path)
        shell: cmd
        run: Setup.cmd --answers ci\answers-windows.json update
      - name: Remove
        shell: cmd
        run: Setup.cmd --answers ci\answers-windows.json remove
      - if: failure()
        name: Report the logs as annotations
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Tail($f) {
            try {
              $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'ReadWrite')
              $sr = New-Object System.IO.StreamReader($fs); $t = $sr.ReadToEnd(); $sr.Close()
              $lines = ($t -replace '%', '%25' -replace "`r", '') -split "`n" | Where-Object { $_ -notmatch 'Applying ' } | Select-Object -Last 70
              $m = $lines -join '%0A'
              if ($m.Length -gt 4000) { $m = $m.Substring($m.Length - 4000) }
              return $m
            } catch { return "could not read: $($_.Exception.Message)" }
          }
          $files = @('C:\ProgramData\DiagTrack\setup-bootstrap.log', 'C:\ProgramData\DiagTrack\setup.log')
          $files += @(Get-ChildItem C:\ProgramData\DiagTrack\logs -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          foreach ($f in $files) { if (Test-Path $f) { Write-Output "::warning title=$(Split-Path $f -Leaf)::$(Tail $f)" } }

  windows-move-in:
    runs-on: windows-2022
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: move-file, path: C:\move}
      - name: Move in from the Docker move file
        shell: cmd
        run: Setup.cmd --answers ci\answers-windows-move.json move
      - name: Screens answer
        shell: pwsh
        run: (Invoke-WebRequest http://localhost:8090/healthz -UseBasicParsing).StatusCode
      - if: failure()
        name: Report the logs as annotations
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          function Tail($f) {
            try {
              $fs = [System.IO.File]::Open($f, 'Open', 'Read', 'ReadWrite')
              $sr = New-Object System.IO.StreamReader($fs); $t = $sr.ReadToEnd(); $sr.Close()
              $lines = ($t -replace '%', '%25' -replace "`r", '') -split "`n" | Where-Object { $_ -notmatch 'Applying ' } | Select-Object -Last 70
              $m = $lines -join '%0A'
              if ($m.Length -gt 4000) { $m = $m.Substring($m.Length - 4000) }
              return $m
            } catch { return "could not read: $($_.Exception.Message)" }
          }
          $files = @('C:\ProgramData\DiagTrack\setup-bootstrap.log', 'C:\ProgramData\DiagTrack\setup.log')
          $files += @(Get-ChildItem C:\ProgramData\DiagTrack\logs -File -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          foreach ($f in $files) { if (Test-Path $f) { Write-Output "::warning title=$(Split-Path $f -Leaf)::$(Tail $f)" } }
