# DiagTrack: five containers on one server. All data stays in the "data" folder
# next to this file, and backups go to BACKUP_DIR (your NAS).
#
#   proxy    front door (port 80, and 443 when HTTPS is on)
#   web      the screens
#   worker   SLA timers, escalations, alerts, auto-close
#   db       PostgreSQL database
#   backup   nightly copy of database and attachments
#
# Start:   docker compose up -d        (builds on first run; restarts by itself after a reboot)
# Stop:    docker compose down
# Health:  docker compose ps
#
# No settings file is needed. To change a default, copy .env.example to .env and edit it.

name: diagtrack

x-app: &app
  build: .
  image: diagtrack-app:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: db
    DB_NAME: diagtrack
    DB_USER: diagtrack
    DB_PASSWORD: ${DB_PASSWORD:-diagtrack}
    SECRET_KEY: ${SECRET_KEY:-}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe@123}
    TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
  volumes:
    - ./data/media:/data/media
    - ./data/status:/data/status

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diagtrack
      POSTGRES_USER: diagtrack
      POSTGRES_PASSWORD: ${DB_PASSWORD:-diagtrack}
      TZ: ${TIME_ZONE:-Asia/Kolkata}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagtrack -d diagtrack"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    command: ["web"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      web:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://}
      HTTPS_MODE: ${HTTPS_MODE:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - web

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DB_NAME: diagtrack
      DB_USER: diagtrack
      DB_PASSWORD: ${DB_PASSWORD:-diagtrack}
      BACKUP_TIME: ${BACKUP_TIME:-01:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_REQUIRE_MARKER: ${BACKUP_REQUIRE_MARKER:-0}
      TZ: ${TIME_ZONE:-Asia/Kolkata}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./data/media:/data/media:ro
      - ./data/status:/data/status
      - ${BACKUP_DIR:-./data/backups}:/backups
    depends_on:
      db:
        condition: service_healthy
