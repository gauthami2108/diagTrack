# DiagTrack in Docker: five containers on one computer, plus a setup helper.
#
#   proxy    front door (port 80, and 443 when HTTPS is on)
#   web      the screens
#   worker   SLA timers, escalations, alerts, auto-close
#   db       PostgreSQL 17 database
#   backup   scheduled backups, Back up now, restores, checks (same engine as the Windows install)
#
# First time:   docker compose run --rm setup        asks the questions, writes .env and the secrets folder
#               docker compose up -d                 starts DiagTrack; it restarts by itself after a reboot
#               docker compose run --rm setup verify checks that everything works
# Stop:         docker compose down
# Health:       docker compose ps
#
# Passwords are never kept in .env: they are files in ./secrets, mounted read-only at /run/secrets.

name: diagtrack

x-app: &app
  build: .
  image: diagtrack-app:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    DB_HOST: db
    DB_NAME: diagtrack
    DB_USER: diagtrack
    TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
    TRUST_X_FORWARDED_FOR: "1"  # the proxy reports which computer is signing in (for the wrong-password lock-out)
  volumes:
    - ./data/media:/data/media
    - ./data/status:/data/status
    - ./secrets:/run/secrets:ro

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diagtrack
      POSTGRES_USER: diagtrack
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: ${TIME_ZONE:-Asia/Kolkata}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagtrack -d diagtrack"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    <<: *app
    command: ["web"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 40s

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      web:
        condition: service_healthy

  backup:
    <<: *app
    command: ["backups"]
    volumes:
      - ./data/media:/data/media
      - ./data/status:/data/status
      - ./secrets:/run/secrets:ro
      - ${BACKUP_DIR:-./data/backups}:/backups
      - ${BACKUP_DIR_2:-./data/backups2}:/backups2
      - ./data/import:/import
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://}
      HTTPS_MODE: ${HTTPS_MODE:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      - web

  # Run on demand only:  docker compose run --rm setup
  setup:
    build: .
    image: diagtrack-app:latest
    profiles: ["setup"]
    entrypoint: ["/entrypoint.sh", "setup"]
    environment:
      DB_HOST: db
      DB_NAME: diagtrack
      DB_USER: diagtrack
      DIAGTRACK_PROJECT: /project
      DIAGTRACK_SECRETS_DIR: /project/secrets
    volumes:
      - .:/project
      - ./data/status:/data/status
    stdin_open: true
    tty: true
